<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Live shared stock</title>
    <link rel="stylesheet" href="/stock.css?v=20261007-1">
    <script src="/stock.js?v=20261007-1" defer></script>
  </head>
  <body>
    <main class="stock-shell">
      <header class="stock-header">
        <div>
          <p class="eyebrow">KEY DROP BOT / PUBLIC INVENTORY</p>
          <h1>Live stock</h1>
          <p class="lede">Shared category counts. Item values are never shown here.</p>
        </div>
        <a class="back-link" href="/">Admin dashboard</a>
      </header>

      <section class="totals" aria-label="Inventory totals">
        <div><span>Available</span><strong id="available-total">—</strong></div>
        <div><span>Claimed</span><strong id="claimed-total">—</strong></div>
        <p id="status" role="status" aria-live="polite">Loading stock…</p>
      </section>

      <section class="inventory" aria-labelledby="inventory-title">
        <div class="inventory-heading">
          <h2 id="inventory-title">By category</h2>
          <span id="category-total">— categories</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th scope="col">Category</th><th scope="col">Type</th><th scope="col">Available</th><th scope="col">Claimed</th></tr>
            </thead>
            <tbody id="stock-rows" aria-live="polite">
              <tr><td colspan="4" class="empty">Loading shared inventory…</td></tr>
            </tbody>
          </table>
        </div>
        <footer class="inventory-footer">
          <span>Refreshes automatically every 10 seconds</span>
          <button id="refresh" class="refresh-button" type="button">Refresh now</button>
        </footer>
      </section>
    </main>
  </body>
</html>
